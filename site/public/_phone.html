<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机预览 · yi.wang photography</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e8e4; font: 13px/1.4 -apple-system, "PingFang SC", system-ui, sans-serif; color: #555; }
  @media (prefers-color-scheme: dark) { html, body { background: #1a1b1c; color: #aaa; } }
  .wrap { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box; gap: 18px; grid-auto-rows: max-content; align-content: center; }
  .bar { display: flex; gap: 6px; align-items: center; }
  .bar button { font: inherit; padding: 5px 11px; border-radius: 999px; border: 1px solid #c9c8c3; background: transparent; color: inherit; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #1b1b1a; color: #fff; border-color: #1b1b1a; }
  .bar a { margin-left: 10px; color: inherit; }
  .phone { width: 390px; height: 844px; max-height: calc(100vh - 110px); border-radius: 44px; background: #111; padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.35); box-sizing: content-box; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: #fff; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button type="button" data-w="375" data-h="812" aria-pressed="false">iPhone SE / 13 mini · 375</button>
    <button type="button" data-w="390" data-h="844" aria-pressed="true">iPhone 14 / 15 · 390</button>
    <button type="button" data-w="430" data-h="932" aria-pressed="false">Pro Max · 430</button>
    <a href="/" target="_blank">桌面版 ↗</a>
  </div>
  <div class="phone" id="phone"><iframe id="frame" src="/" title="site preview"></iframe></div>
</div>
<script>
  const phone = document.getElementById("phone");
  for (const b of document.querySelectorAll(".bar button")) b.addEventListener("click", () => {
    document.querySelectorAll(".bar button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    phone.style.width = b.dataset.w + "px"; phone.style.height = b.dataset.h + "px";
  });
</script>
</body>
</html>
